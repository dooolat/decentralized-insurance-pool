specVersion: 1.2.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: InsurancePool
    network: base-sepolia
    source:
      address: "0xD81fcdad2fD693F8C0EE2b31D30D0D7dA34992c3"
      abi: InsurancePool
      startBlock: 41647976
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Policy
      abis:
        - name: InsurancePool
          file: ./abis/InsurancePool.json
      eventHandlers:
        - event: PolicyCreated(indexed uint256,indexed address,indexed uint256,uint256,uint256,uint256,uint256)
          handler: handlePolicyCreated
        - event: PolicyExpired(indexed uint256)
          handler: handlePolicyExpired
        - event: PolicyClaimed(indexed uint256,uint256)
          handler: handlePolicyClaimed
      file: ./src/mappings.ts

  - kind: ethereum
    name: ClaimManager
    network: base-sepolia
    source:
      address: "0xd745342115e82266f7F3db51D2e0AA747C2Ca7DE"
      abi: ClaimManager
      startBlock: 41647976
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Claim
      abis:
        - name: ClaimManager
          file: ./abis/ClaimManager.json
      eventHandlers:
        - event: ClaimPaid(indexed uint256,indexed address,uint256)
          handler: handleClaimPaid
      file: ./src/mappings.ts

  - kind: ethereum
    name: RiskRegistry
    network: base-sepolia
    source:
      address: "0xd79cB6fB67d5e528821A01662A035381CED1429b"
      abi: RiskRegistry
      startBlock: 41647976
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RiskType
      abis:
        - name: RiskRegistry
          file: ./abis/RiskRegistry.json
      eventHandlers:
        - event: RiskTypeAdded(indexed uint256,string,uint16,uint256,indexed address,uint256,uint256)
          handler: handleRiskTypeAdded
        - event: RiskTypeUpdated(indexed uint256,string,uint16,uint256,indexed address,uint256,uint256,bool)
          handler: handleRiskTypeUpdated
        - event: RiskTypeDeactivated(indexed uint256)
          handler: handleRiskTypeDeactivated
      file: ./src/mappings.ts

  - kind: ethereum
    name: InsuranceVault
    network: base-sepolia
    source:
      address: "0xd994D34Ef43A528380B5324E8AC9a49F8feD22F5"
      abi: InsuranceVault
      startBlock: 41647976
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - VaultDeposit
      abis:
        - name: InsuranceVault
          file: ./abis/InsuranceVault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleVaultDeposit
      file: ./src/mappings.ts

  - kind: ethereum
    name: InsuranceAMM
    network: base-sepolia
    source:
      address: "0x4105e0F64aE288585bA8333FD485b46DC196758e"
      abi: InsuranceAMM
      startBlock: 41647976
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Swap
        - LiquidityPosition
      abis:
        - name: InsuranceAMM
          file: ./abis/InsuranceAMM.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,uint256,indexed address,uint256)
          handler: handleSwap
        - event: LiquidityAdded(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityAdded
      file: ./src/mappings.ts

  - kind: ethereum
    name: ProtocolGovernor
    network: base-sepolia
    source:
      address: "0xF38fdbce1F925333713349B54FDc24a816148157"
      abi: ProtocolGovernor
      startBlock: 41647976
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - GovernanceProposal
        - Vote
      abis:
        - name: ProtocolGovernor
          file: ./abis/ProtocolGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
      file: ./src/mappings.ts
